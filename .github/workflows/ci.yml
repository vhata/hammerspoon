# Merge-blocking checks. Every job calls a script in scripts/ or
# docket/scripts/, so `bash scripts/lint.sh` reproduces the check job locally
# and `bash docket/scripts/ci.sh` the hygiene job. See docs/QUALITY.md.
name: CI

on:
  pull_request:
    # edited: re-validate PR markers when the description changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash   # explicit bash gives `-eo pipefail`

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only. Cancelling runs on main hides
  # red builds when several PRs merge in quick succession.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: bash scripts/lint.sh

  workflow:
    name: Queue and PR hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Queue validation, link check and, on pull requests, the marker check.
      # The PR variables are empty on pushes, which skips the marker check.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh
